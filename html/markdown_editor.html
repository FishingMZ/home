<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fishing's Home - Markdown 编辑器</title>

    <link rel="icon" href="../assets/icons/favicon.ico" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" />

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>

        @font-face {
          font-family: 'BlueArchive';
          src: url('../assets/fonts/font.ttf') format('truetype');
        }
        
        /* ============================================
                   MD3 Premium 颜色与微动效系统
           ============================================ */
        :root {
            /* 浅色基调 - 精致画布风格 */
            --md-sys-color-primary: #6750A4;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #EADDFF;
            --md-sys-color-on-primary-container: #21005E;

            --md-sys-color-surface: #F6F4F9; /* 柔和背景 */
            --md-sys-color-on-surface: #1D1B20;
            --md-sys-color-surface-container-lowest: #FFFFFF; /* 卡片白 */
            --md-sys-color-surface-container: #F3EDF7;
            --md-sys-color-surface-container-high: #ECE6F0;
            --md-sys-color-surface-container-low: #F7F2FA;

            --md-sys-color-outline: #79747E;
            --md-sys-color-outline-variant: #E0DBE5;

            /* 现代多层空气感阴影 */
            --md-sys-color-shadow: rgba(103, 80, 164, 0.03);
            --md-sys-color-shadow-medium: rgba(103, 80, 164, 0.06);
            --md-sys-color-shadow-heavy: rgba(0, 0, 0, 0.12);

            --md-sys-color-on-surface-variant: #49454F;

            --md-ref-typeface: 'BlueArchive','Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --md-ref-typeface-mono: 'JetBrains Mono', 'Roboto Mono', 'Consolas', monospace;

            --md-shape-corner-small: 8px;
            --md-shape-corner-medium: 16px;
            --md-shape-corner-large: 24px;
            --md-shape-corner-full: 9999px;

            --md-space-1: 4px;
            --md-space-2: 8px;
            --md-space-3: 12px;
            --md-space-4: 20px;
            --md-space-5: 28px;
            --md-space-6: 36px;

            --md-motion-duration: 260ms;
            --md-motion-easing: cubic-bezier(0.34, 1.56, 0.64, 1); /* 微弹簧力学 */

            --md-code-bg: #F8F6FA;
            --md-code-border: #E8E5ED;
            --md-code-color: #1D1B20;
        }

        /* 深色基调 - 极具质感的深邃夜间模式 */
        body.dark-theme {
            --md-sys-color-primary: #D0BCFF;
            --md-sys-color-on-primary: #381E72;
            --md-sys-color-primary-container: #4F378B;
            --md-sys-color-on-primary-container: #EADDFF;

            --md-sys-color-surface: #121016; /* 舒适黑 */
            --md-sys-color-on-surface: #E6E0E9;
            --md-sys-color-surface-container-lowest: #1A181E; /* 卡片黑 */
            --md-sys-color-surface-container: #211F26;
            --md-sys-color-surface-container-high: #2B2930;
            --md-sys-color-surface-container-low: #1D1B22;

            --md-sys-color-outline: #938F99;
            --md-sys-color-outline-variant: #36343B;

            --md-sys-color-shadow: rgba(0, 0, 0, 0.3);
            --md-sys-color-shadow-medium: rgba(0, 0, 0, 0.45);
            --md-sys-color-shadow-heavy: rgba(0, 0, 0, 0.6);

            --md-sys-color-on-surface-variant: #CAC4D0;

            --md-code-bg: #232127;
            --md-code-border: #36343B;
            --md-code-color: #E6E0E9;
        }

        /* ============================================
                   全局基底与滚动条
                   ============================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--md-ref-typeface);
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background var(--md-motion-duration) var(--md-motion-easing),
                        color var(--md-motion-duration) var(--md-motion-easing);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--md-sys-color-outline-variant);
            border-radius: var(--md-shape-corner-full);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--md-sys-color-outline);
        }

        /* ============================================
                   顶部导航栏（Glassmorphism 毛玻璃效果）
                   ============================================ */
        .app-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--md-space-5);
            height: 72px;
            background: rgba(255, 255, 255, 0.65);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            flex-shrink: 0;
            z-index: 10;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 0 1px 2px var(--md-sys-color-shadow);
            transition: background var(--md-motion-duration) var(--md-motion-easing),
                        border-color var(--md-motion-duration) var(--md-motion-easing);
        }
        body.dark-theme .app-bar {
            background: rgba(18, 16, 22, 0.65);
        }

        .app-bar-left {
            display: flex;
            align-items: center;
            gap: var(--md-space-3);
        }
        .app-bar-left .material-symbols-outlined {
            font-size: 32px;
            color: var(--md-sys-color-primary);
            font-variation-settings: 'FILL' 1;
            transition: transform 0.3s ease;
        }
        .app-bar-left .material-symbols-outlined:hover {
            transform: rotate(-8deg) scale(1.05);
        }
        .app-bar-left .title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .app-bar-left .title span {
            font-weight: 300;
            color: var(--md-sys-color-outline);
        }

        .app-bar-right {
            display: flex;
            align-items: center;
            gap: var(--md-space-2);
        }

        /* ============================================
                   按钮动效美化
                   ============================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: var(--md-space-2);
            padding: 0 var(--md-space-4);
            height: 44px;
            border: none;
            border-radius: var(--md-shape-corner-full);
            font-family: var(--md-ref-typeface);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--md-motion-duration) var(--md-motion-easing);
            background: transparent;
            color: var(--md-sys-color-on-surface);
            position: relative;
            overflow: hidden;
        }
        .btn .material-symbols-outlined {
            font-size: 20px;
            transition: transform 0.2s ease;
        }
        .btn:hover .material-symbols-outlined {
            transform: scale(1.1);
        }
        .btn:active {
            transform: scale(0.95);
        }

        .btn-filled {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            box-shadow: 0 4px 12px var(--md-sys-color-shadow-medium);
        }
        .btn-filled:hover {
            box-shadow: 0 6px 20px var(--md-sys-color-shadow-heavy);
            filter: brightness(1.06);
            transform: translateY(-1px);
        }

        .btn-text {
            color: var(--md-sys-color-primary);
        }
        .btn-text:hover { background: rgba(103, 80, 164, 0.08); }
        body.dark-theme .btn-text:hover { background: rgba(208, 188, 255, 0.12); }

        .btn-outlined {
            border: 1px solid var(--md-sys-color-outline-variant);
        }
        .btn-outlined:hover {
            background: rgba(103, 80, 164, 0.04);
            border-color: var(--md-sys-color-primary);
        }
        body.dark-theme .btn-outlined:hover { background: rgba(208, 188, 255, 0.06); }

        .btn-icon {
            width: 44px;
            height: 44px;
            padding: 0;
            justify-content: center;
            color: var(--md-sys-color-on-surface-variant);
        }
        .btn-icon:hover {
            background: rgba(0, 0, 0, 0.05);
            color: var(--md-sys-color-primary);
        }
        body.dark-theme .btn-icon:hover { background: rgba(255, 255, 255, 0.08); }

        /* 涟漪模拟 */
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: radial-gradient(circle at var(--ripple-x, 50%) var(--ripple-y, 50%), rgba(255, 255, 255, 0.25) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .btn:active::after { opacity: 1; transition: opacity 0s; }

        #fileInput { display: none; }

        /* ============================================
                   画布布局（Floating Canvas Layout）
                   ============================================ */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: var(--md-space-4);
            gap: var(--md-space-4);
            background: var(--md-sys-color-surface);
            transition: background var(--md-motion-duration) var(--md-motion-easing);
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--md-sys-color-surface-container-lowest);
            border-radius: var(--md-shape-corner-large);
            border: 1px solid var(--md-sys-color-outline-variant);
            box-shadow: 0 8px 32px var(--md-sys-color-shadow);
            overflow: hidden;
            transition: background var(--md-motion-duration) var(--md-motion-easing),
                        border-color var(--md-motion-duration) var(--md-motion-easing),
                        box-shadow var(--md-motion-duration) var(--md-motion-easing);
        }
        .panel:focus-within {
            border-color: var(--md-sys-color-primary);
            box-shadow: 0 12px 40px var(--md-sys-color-shadow-medium);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--md-space-3) var(--md-space-4);
            background: rgba(255, 255, 255, 0.4);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            backdrop-filter: blur(10px);
            min-height: 56px;
        }
        body.dark-theme .panel-header {
            background: rgba(26, 24, 30, 0.4);
        }

        .panel-header .label {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--md-sys-color-on-surface);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: var(--md-space-2);
        }
        .panel-header .label .material-symbols-outlined {
            font-size: 20px;
            color: var(--md-sys-color-primary);
        }

        .panel-header .badge {
            font-size: 12px;
            font-weight: 600;
            color: var(--md-sys-color-primary);
            background: var(--md-sys-color-primary-container);
            padding: 4px var(--md-space-3);
            border-radius: var(--md-shape-corner-full);
            border: 1px solid var(--md-sys-color-outline-variant);
        }

        .panel-body {
            flex: 1;
            overflow: auto;
            padding: var(--md-space-5);
            position: relative;
        }

        /* 编辑核心区 */
        #editor {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            resize: none;
            font-family: var(--md-ref-typeface-mono);
            font-size: 15px;
            line-height: 1.8;
            color: var(--md-sys-color-on-surface);
            background: transparent;
            caret-color: var(--md-sys-color-primary);
        }
        #editor::placeholder {
            color: var(--md-sys-color-outline);
            font-family: var(--md-ref-typeface);
            font-weight: 400;
            opacity: 0.7;
        }

        /* 拖拽动态层 */
        .drop-overlay {
            position: absolute;
            inset: var(--md-space-3);
            background: rgba(234, 226, 252, 0.9);
            border: 2px dashed var(--md-sys-color-primary);
            border-radius: var(--md-shape-corner-medium);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: var(--md-space-2);
            opacity: 0;
            pointer-events: none;
            transition: all var(--md-motion-duration) var(--md-motion-easing);
            z-index: 15;
            backdrop-filter: blur(8px);
        }
        body.dark-theme .drop-overlay {
            background: rgba(79, 55, 139, 0.9);
        }
        .drop-overlay.active { opacity: 0.95; }
        .drop-overlay .material-symbols-outlined {
            font-size: 56px;
            color: var(--md-sys-color-primary);
        }
        .drop-overlay .text {
            font-size: 16px;
            font-weight: 600;
            color: var(--md-sys-color-on-primary-container);
        }

        /* ============================================
                   预览排版系统美化（Typography）
                   ============================================ */
        #preview {
            font-family: var(--md-ref-typeface);
            font-size: 15px;
            line-height: 1.85;
            color: var(--md-sys-color-on-surface);
        }

        #preview h1, #preview h2, #preview h3, #preview h4, #preview h5, #preview h6 {
            margin: 1.5em 0 0.5em 0;
            font-weight: 700;
            color: var(--md-sys-color-on-surface);
            letter-spacing: -0.015em;
        }
        #preview h1 { font-size: 2.2em; border-bottom: 2px solid var(--md-sys-color-outline-variant); padding-bottom: 0.4em; }
        #preview h2 { font-size: 1.75em; }
        #preview h3 { font-size: 1.35em; }
        #preview h6 { color: var(--md-sys-color-outline); }

        #preview p { margin: 0.8em 0; text-align: justify; }
        #preview a {
            color: var(--md-sys-color-primary);
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1.5px solid transparent;
            transition: border-color var(--md-motion-duration-short) var(--md-motion-easing);
        }
        #preview a:hover { border-bottom-color: var(--md-sys-color-primary); }

        #preview ul, #preview ol { margin: 0.8em 0; padding-left: 1.8em; }
        #preview li { margin: 0.3em 0; }

        #preview blockquote {
            margin: 1.2em 0;
            padding: 0.8em 1.4em;
            border-left: 5px solid var(--md-sys-color-primary);
            background: var(--md-sys-color-surface-container);
            border-radius: 0 var(--md-shape-corner-medium) var(--md-shape-corner-medium) 0;
            color: var(--md-sys-color-on-surface-variant);
            font-style: italic;
        }

        #preview code {
            font-family: var(--md-ref-typeface-mono);
            font-size: 0.9em;
            background: var(--md-code-bg);
            padding: 0.2em 0.5em;
            border-radius: 6px;
            color: var(--md-code-color);
            border: 1px solid var(--md-code-border);
        }

        #preview pre {
            background: var(--md-code-bg);
            border-radius: var(--md-shape-corner-medium);
            padding: var(--md-space-4);
            overflow-x: auto;
            margin: 1.2em 0;
            border: 1px solid var(--md-code-border);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
        }
        #preview pre code {
            background: transparent;
            padding: 0;
            color: var(--md-code-color);
            border: none;
        }

        #preview img {
            max-width: 100%;
            border-radius: var(--md-shape-corner-medium);
            margin: 1em 0;
            box-shadow: 0 12px 32px var(--md-sys-color-shadow-medium);
        }

        #preview table {
            border-collapse: collapse;
            width: 100%;
            margin: 1.5em 0;
            border-radius: var(--md-shape-corner-medium);
            overflow: hidden;
            box-shadow: 0 4px 16px var(--md-sys-color-shadow);
        }
        #preview th, #preview td {
            border: 1px solid var(--md-sys-color-outline-variant);
            padding: 0.6em 1.1em;
        }
        #preview th { background: var(--md-sys-color-surface-container); font-weight: 700; text-align: left; }
        #preview tr:nth-child(even) { background: var(--md-sys-color-surface-container-low); }

        #preview hr { border: none; border-top: 2px dashed var(--md-sys-color-outline-variant); margin: 2em 0; }

        #preview .task-list-item { list-style: none; margin-left: -1.2em; }
        #preview .task-list-item input[type="checkbox"] { margin-right: 0.5em; accent-color: var(--md-sys-color-primary); transform: scale(1.1); }

        .empty-preview {
            color: var(--md-sys-color-outline);
            text-align: center;
            padding: 4em 0;
            font-weight: 300;
            opacity: 0.7;
        }

        /* ============================================
                   Toast 提示弹窗
                   ============================================ */
        .toast {
            position: fixed;
            bottom: var(--md-space-5);
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--md-sys-color-surface-container-high);
            color: var(--md-sys-color-on-surface);
            padding: var(--md-space-3) var(--md-space-5);
            border-radius: var(--md-shape-corner-full);
            box-shadow: 0 12px 40px var(--md-sys-color-shadow-heavy);
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
            opacity: 0;
            transition: all var(--md-motion-duration) var(--md-motion-easing);
            border: 1px solid var(--md-sys-color-outline-variant);
            display: flex;
            align-items: center;
            gap: var(--md-space-2);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast .material-symbols-outlined { color: var(--md-sys-color-primary); font-variation-settings: 'FILL' 1; }

        /* ============================================
                   响应式结构调整
                   ============================================ */
        @media (max-width: 768px) {
            .app-bar { padding: 0 var(--md-space-4); height: 56px; flex-wrap: wrap; gap: var(--md-space-2); }
            .app-bar-left .title { font-size: 17px; }
            .app-bar-left .material-symbols-outlined { font-size: 24px; }
            .btn { height: 36px; font-size: 13px; padding: 0 var(--md-space-3); }
            .btn-text .btn-label, .btn-filled .btn-label, .btn-outlined .btn-label { display: none; }
            .main-content { flex-direction: column; padding: var(--md-space-2); gap: var(--md-space-2); }
            .panel { border-radius: var(--md-shape-corner-medium); }
            .panel-body { padding: var(--md-space-3); }
        }

        @media (max-width: 480px) {
            .app-bar { height: 48px; padding: 0 var(--md-space-3); }
            .app-bar-left .title { font-size: 15px; }
            .btn { height: 32px; font-size: 12px; padding: 0 var(--md-space-2); }
            .btn-icon { width: 32px; height: 32px; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.04); opacity: 0.8; }
        }
        .drop-overlay.active .material-symbols-outlined { animation: pulse 1.4s ease-in-out infinite; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header class="app-bar" role="banner">
        <div class="app-bar-left">
            <span class="material-symbols-outlined" aria-hidden="true">edit_note</span>
            <span class="title">Markdown <span>编辑器</span></span>
        </div>
        <div class="app-bar-right">
            <button class="btn btn-icon" id="themeToggle" title="切换深色/浅色模式">
                <span class="material-symbols-outlined" aria-hidden="true">dark_mode</span>
            </button>
            <button class="btn btn-text" id="exampleBtn" title="加载示例内容">
                <span class="material-symbols-outlined" aria-hidden="true">description</span>
                <span class="btn-label">示例</span>
            </button>
            <button class="btn btn-outlined" id="uploadBtn" title="上传 .md 文件">
                <span class="material-symbols-outlined" aria-hidden="true">upload_file</span>
                <span class="btn-label">上传</span>
            </button>
            <button class="btn btn-filled" id="downloadBtn" title="下载 .md 文件 (Ctrl+S)">
                <span class="material-symbols-outlined" aria-hidden="true">download</span>
                <span class="btn-label">下载</span>
            </button>
        </div>
    </header>

    <input type="file" id="fileInput" accept=".md,.markdown" />

    <main class="main-content">
        <section class="panel" id="editorPanel">
            <div class="panel-header">
                <span class="label">
                    <span class="material-symbols-outlined" aria-hidden="true">edit</span>编辑
                </span>
                <span class="badge" id="wordCount">0 字</span>
            </div>
            <div class="panel-body" id="editorBody">
                <textarea id="editor" placeholder="在此输入 Markdown 内容…&#10;支持拖拽上传 .md 文件"></textarea>
                <div class="drop-overlay" id="dropOverlay">
                    <span class="material-symbols-outlined" aria-hidden="true">cloud_upload</span>
                    <span class="text">释放以上传 .md 文件</span>
                </div>
            </div>
        </section>

        <section class="panel" id="previewPanel">
            <div class="panel-header">
                <span class="label">
                    <span class="material-symbols-outlined" aria-hidden="true">visibility</span>预览
                </span>
                <span class="badge" id="previewStatus">实时</span>
            </div>
            <div class="panel-body" id="previewBody">
                <div id="preview">
                    <div class="empty-preview">✨ 开始编写 Markdown…</div>
                </div>
            </div>
        </section>
    </main>

    <div class="toast" id="toast">
        <span class="material-symbols-outlined" aria-hidden="true">check_circle</span>
        <span id="toastMessage">已保存</span>
    </div>

    <script>
        (function() {
            'use strict';

            // ---- DOM ----
            const editor = document.getElementById('editor');
            const preview = document.getElementById('preview');
            const wordCount = document.getElementById('wordCount');
            const fileInput = document.getElementById('fileInput');
            const uploadBtn = document.getElementById('uploadBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const exampleBtn = document.getElementById('exampleBtn');
            const dropOverlay = document.getElementById('dropOverlay');
            const editorBody = document.getElementById('editorBody');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = themeToggle.querySelector('.material-symbols-outlined');

            // ---- 状态 ----
            let currentFileName = 'document.md';
            let toastTimer = null;
            let isDark = localStorage.getItem('md3-theme') === 'dark';

            // ---- 示例内容（恢复最原生态版本） ----
            const EXAMPLE_MARKDOWN =
                `# 欢迎使用 Markdown 编辑器 🚀

## 功能特性

- ✨ 实时预览
- 📤 上传 .md 文件（支持拖拽）

}
console.log(greet('MD3'));

  - 子项目 B

            // ---- 主题 ----
            function setTheme(dark) {
                isDark = dark;
                document.body.classList.toggle('dark-theme', dark);
                themeIcon.textContent = dark ? 'light_mode' : 'dark_mode';
                localStorage.setItem('md3-theme', dark ? 'dark' : 'light');
            }
            if (isDark) {
                document.body.classList.add('dark-theme');
                themeIcon.textContent = 'light_mode';
            } else {
                document.body.classList.remove('dark-theme');
                themeIcon.textContent = 'dark_mode';
            }
            themeToggle.addEventListener('click', () => {
                setTheme(!isDark);
                showToast(isDark ? '深色模式' : '浅色模式', isDark ? 'dark_mode' : 'light_mode');
            });

            // ---- 核心 ----
            function updatePreview() {
                const markdown = editor.value;
                if (!markdown.trim()) {
                    preview.innerHTML = `<div class="empty-preview">✨ 开始编写 Markdown…</div>`;
                    return;
                }
                try {
                    const html = marked.parse(markdown, {
                        gfm: true,
                        breaks: true,
                        headerIds: false,
                        mangle: false,
                    });
                    preview.innerHTML = html;
                } catch (err) {
                    preview.innerHTML =
                        `<div class="empty-preview" style="color:#B3261E;">⚠️ 解析错误：${err.message}</div>`;
                }
            }

            function updateWordCount() {
                const text = editor.value;
                const chars = text.replace(/\s/g, '').length;
                wordCount.textContent = chars + ' 字';
            }

            function showToast(message, icon = 'check_circle') {
                toastMessage.textContent = message;
                const iconEl = toast.querySelector('.material-symbols-outlined');
                if (iconEl) iconEl.textContent = icon;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2400);
            }

            function loadContent(content, fileName = null) {
                editor.value = content;
                if (fileName) currentFileName = fileName;
                updatePreview();
                updateWordCount();
                editor.scrollTop = 0;
            }

            function loadFile(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    loadContent(e.target.result, file.name);
                    showToast(`已加载 “${file.name}”`, 'upload_file');
                };
                reader.onerror = () => showToast('读取文件失败，请重试', 'error');
                reader.readAsText(file);
            }

            function downloadFile() {
                const content = editor.value;
                if (!content.trim()) {
                    showToast('内容为空，无法下载', 'warning');
                    return;
                }
                const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = currentFileName || 'document.md';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast(`已下载 “${a.download}”`, 'download');
            }

            // ---- 事件 ----
            editor.addEventListener('input', () => {
                updatePreview();
                updateWordCount();
            });

            uploadBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', () => {
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const ext = file.name.split('.').pop().toLowerCase();
                    if (ext !== 'md' && ext !== 'markdown') {
                        showToast('请上传 .md 或 .markdown 文件', 'warning');
                        fileInput.value = '';
                        return;
                    }
                    loadFile(file);
                }
                fileInput.value = '';
            });

            downloadBtn.addEventListener('click', downloadFile);
            exampleBtn.addEventListener('click', () => {
                loadContent(EXAMPLE_MARKDOWN, 'example.md');
                showToast('已加载示例内容', 'description');
            });

            // 拖拽
            let dragCounter = 0;
            editorBody.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropOverlay.classList.add('active');
            });
            editorBody.addEventListener('dragenter', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dragCounter++;
                dropOverlay.classList.add('active');
            });
            editorBody.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dragCounter--;
                if (dragCounter <= 0) {
                    dragCounter = 0;
                    dropOverlay.classList.remove('active');
                }
            });
            editorBody.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dragCounter = 0;
                dropOverlay.classList.remove('active');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    const file = files[0];
                    const ext = file.name.split('.').pop().toLowerCase();
                    if (ext !== 'md' && ext !== 'markdown') {
                        showToast('请拖拽 .md 或 .markdown 文件', 'warning');
                        return;
                    }
                    loadFile(file);
                }
            });
            document.addEventListener('dragover', (e) => e.preventDefault());
            document.addEventListener('drop', (e) => e.preventDefault());

            // 快捷键
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    downloadFile();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
                    e.preventDefault();
                    fileInput.click();
                }
            });

            // 预览链接新窗口
            preview.addEventListener('click', (e) => {
                const target = e.target.closest('a');
                if (target && target.href && target.href.startsWith('http')) {
                    e.preventDefault();
                    window.open(target.href, '_blank', 'noopener,noreferrer');
                }
            });

            // ---- 初始化 ----
            loadContent(EXAMPLE_MARKDOWN, 'example.md');
            setTimeout(() => {
                showToast('💡 Ctrl+S 下载 · Ctrl+O 上传', 'info');
            }, 600);

            console.log('📝 Markdown 编辑器 (MD3 增强版)');
        })();
    </script>
</body>
