<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>墨言 · 博客</title>

    <!-- ===== 使用 CDN 加载 marked 和 highlight.js ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js">
    </script>

    <style>
        /* ============================================================
               全局样式 & CSS 变量
               ============================================================ */
        :root {
            --primary: #3b6ea5;
            --primary-light: #5a8cc9;
            --primary-dark: #2a4f7a;
            --bg: #f6f9fc;
            --card-bg: #ffffff;
            --text: #1e2a3a;
            --text-secondary: #4a5a6e;
            --text-muted: #8a9aa8;
            --border: #e2e8f0;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.10);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.25s ease;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --max-width: 820px;
            --header-height: 64px;
        }

        /* 深色主题 (可通过 JS 切换) */
        [data-theme="dark"] {
            --bg: #0f1724;
            --card-bg: #1a2538;
            --text: #e8edf4;
            --text-secondary: #b0c0d4;
            --text-muted: #6a7e96;
            --border: #2a3a50;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        /* ---------- 重置 & 基础 ---------- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            transition: background var(--transition), color var(--transition);
            padding-top: var(--header-height);
            min-height: 100vh;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            transition: color var(--transition);
        }
        a:hover {
            color: var(--primary-dark);
        }

        /* ---------- 滚动条 ---------- */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* ============================================================
               头部
               ============================================================ */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background-color: rgba(255, 255, 255, 0.82);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            transition: background var(--transition), border var(--transition);
        }
        [data-theme="dark"] .header {
            background-color: rgba(15, 23, 36, 0.88);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .header-brand .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            background: var(--primary);
            color: #fff;
            border-radius: var(--radius-sm);
            font-size: 1.1rem;
            font-weight: 600;
        }
        .header-brand span {
            color: var(--text-secondary);
            font-weight: 400;
            font-size: 0.9rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all var(--transition);
            background: var(--card-bg);
        }
        .theme-toggle:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: rotate(12deg);
        }

        .header-back {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
            color: var(--text-secondary);
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            transition: all var(--transition);
            background: var(--card-bg);
            font-family: inherit;
        }
        .header-back:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .header-back.visible {
            display: inline-flex;
        }

        /* ============================================================
               主容器
               ============================================================ */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 30px 24px 60px;
        }

        /* ============================================================
               首页 - 文章列表
               ============================================================ */
        .page-home .home-header {
            margin-bottom: 36px;
        }
        .page-home .home-header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }
        .page-home .home-header p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            margin-top: 6px;
        }

        .post-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .post-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px 28px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: all var(--transition);
            cursor: pointer;
            position: relative;
        }
        .post-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }
        .post-card:active {
            transform: scale(0.99);
        }

        .post-card .meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .post-card .meta .date {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .post-card .meta .tag {
            background: var(--bg);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .post-card h2 {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            line-height: 1.4;
            margin-bottom: 6px;
            color: var(--text);
        }
        .post-card h2 a {
            color: inherit;
        }
        .post-card h2 a:hover {
            color: var(--primary);
        }

        .post-card .summary {
            color: var(--text-secondary);
            font-size: 0.95rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 4px;
        }

        .post-card .read-more {
            display: inline-block;
            margin-top: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--primary);
        }
        .post-card .read-more::after {
            content: " →";
            transition: transform var(--transition);
            display: inline-block;
        }
        .post-card:hover .read-more::after {
            transform: translateX(4px);
        }

        /* ============================================================
               文章详情页
               ============================================================ */
        .page-post .post-detail {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 40px 44px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: background var(--transition), border var(--transition);
        }

        .post-detail .post-title {
            font-size: 2.0rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.25;
            margin-bottom: 8px;
        }

        .post-detail .post-meta {
            display: flex;
            align-items: center;
            gap: 18px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 18px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .post-detail .post-meta .date {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ---------- Markdown 渲染内容 ---------- */
        .post-content {
            font-size: 1.05rem;
            line-height: 1.85;
            color: var(--text);
        }
        .post-content h1,
        .post-content h2,
        .post-content h3,
        .post-content h4,
        .post-content h5,
        .post-content h6 {
            margin-top: 1.8em;
            margin-bottom: 0.5em;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.3px;
        }
        .post-content h1 {
            font-size: 1.8rem;
        }
        .post-content h2 {
            font-size: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.3em;
        }
        .post-content h3 {
            font-size: 1.25rem;
        }

        .post-content p {
            margin: 1em 0;
        }

        .post-content a {
            color: var(--primary);
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .post-content a:hover {
            color: var(--primary-dark);
        }

        .post-content ul,
        .post-content ol {
            padding-left: 1.6em;
            margin: 0.8em 0;
        }
        .post-content li {
            margin: 0.3em 0;
        }

        .post-content blockquote {
            border-left: 4px solid var(--primary);
            background: var(--bg);
            padding: 0.8em 1.4em;
            margin: 1.2em 0;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            color: var(--text-secondary);
        }
        .post-content blockquote p {
            margin: 0.4em 0;
        }

        .post-content code {
            font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
            font-size: 0.9em;
            background: var(--bg);
            padding: 0.2em 0.5em;
            border-radius: 4px;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .post-content pre {
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            overflow-x: auto;
            margin: 1.2em 0;
            border: 1px solid var(--border);
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .post-content pre code {
            background: transparent;
            border: none;
            padding: 0;
            font-size: inherit;
            color: inherit;
        }

        .post-content img {
            max-width: 100%;
            height: auto;
            border-radius: var(--radius-sm);
            margin: 1.2em 0;
            border: 1px solid var(--border);
        }
        .post-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.2em 0;
            font-size: 0.95rem;
        }
        .post-content th,
        .post-content td {
            border: 1px solid var(--border);
            padding: 8px 14px;
            text-align: left;
        }
        .post-content th {
            background: var(--bg);
            font-weight: 600;
        }

        .post-content hr {
            border: none;
            border-top: 2px dashed var(--border);
            margin: 2em 0;
        }

        /* ---------- 加载 & 错误状态 ---------- */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .loading-state .spinner {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-bottom: 14px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .error-state .icon {
            font-size: 2.8rem;
            margin-bottom: 12px;
        }
        .error-state h2 {
            font-size: 1.4rem;
            margin-bottom: 6px;
        }

        /* ============================================================
               页脚
               ============================================================ */
        .footer {
            max-width: var(--max-width);
            margin: 40px auto 0;
            padding: 20px 24px 40px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
        }

        /* ============================================================
               响应式
               ============================================================ */
        @media (max-width: 640px) {
            :root {
                --header-height: 58px;
                --max-width: 100%;
            }
            .header {
                padding: 0 16px;
            }
            .header-brand {
                font-size: 1.05rem;
            }
            .header-brand .logo {
                width: 30px;
                height: 30px;
                font-size: 0.95rem;
            }
            .header-brand span {
                display: none;
            }
            .container {
                padding: 20px 14px 40px;
            }
            .page-home .home-header h1 {
                font-size: 1.7rem;
            }
            .post-card {
                padding: 18px 18px;
            }
            .post-card h2 {
                font-size: 1.15rem;
            }
            .post-detail {
                padding: 24px 18px !important;
            }
            .post-detail .post-title {
                font-size: 1.5rem;
            }
            .post-content {
                font-size: 0.98rem;
            }
            .post-content pre {
                padding: 12px 14px;
                font-size: 0.8rem;
            }
            .theme-toggle {
                width: 34px;
                height: 34px;
                font-size: 1rem;
            }
            .header-back {
                font-size: 0.85rem;
                padding: 4px 12px;
            }
        }

        @media (max-width: 420px) {
            .post-detail .post-meta {
                font-size: 0.8rem;
                gap: 10px;
            }
            .post-card .meta {
                font-size: 0.75rem;
                flex-wrap: wrap;
            }
        }

        /* ============================================================
               工具类
               ============================================================ */
        .hidden {
            display: none !important;
        }
        .fade-in {
            animation: fadeIn 0.35s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    头部
    ============================================================ -->
    <header class="header" role="banner">
        <div class="header-brand">
            <span class="logo">墨</span>
            墨言
            <span>· 静思录</span>
        </div>

        <div class="header-actions">
            <button class="header-back" id="backBtn" aria-label="返回列表">
                ← 返回
            </button>
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                🌙
            </button>
        </div>
    </header>

    <!-- ============================================================
    主容器
    ============================================================ -->
    <main class="container" id="app" role="main">

        <!-- ===== 首页 ===== -->
        <div id="pageHome" class="page-home">
            <div class="home-header">
                <h1>📖 所有文章</h1>
                <p>用文字记录思考，以代码构建世界</p>
            </div>
            <div id="postList" class="post-list">
                <!-- 由 JavaScript 动态渲染 -->
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>加载文章列表...</p>
                </div>
            </div>
        </div>

        <!-- ===== 文章详情页 ===== -->
        <div id="pagePost" class="page-post hidden">
            <div id="postDetail" class="post-detail">
                <!-- 由 JavaScript 动态渲染 -->
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>加载文章内容...</p>
                </div>
            </div>
        </div>

    </main>

    <!-- ============================================================
    页脚
    ============================================================ -->
    <footer class="footer">
        &copy; 2026 <a href="#">墨言博客</a> · 基于 Markdown · 部署于 GitHub Pages
    </footer>

    <!-- ============================================================
    JavaScript 主逻辑
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ---------- 配置 ----------
            const CONFIG = {
                // 文章索引文件路径
                indexUrl: 'index.json',
                // 文章存放目录
                postsDir: 'posts/',
                // 默认文章 ID（当 URL 中没有指定时）
                defaultPost: null,
            };

            // ---------- DOM 引用 ----------
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            const pageHome = $('#pageHome');
            const pagePost = $('#pagePost');
            const postList = $('#postList');
            const postDetail = $('#postDetail');
            const backBtn = $('#backBtn');
            const themeToggle = $('#themeToggle');

            // ---------- 状态 ----------
            let posts = []; // 文章列表
            let currentPostId = null; // 当前文章 ID
            let isLoading = false;

            // ---------- 主题切换 ----------
            function getPreferredTheme() {
                const stored = localStorage.getItem('blog-theme');
                if (stored) return stored;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }

            function setTheme(theme) {
                const isDark = theme === 'dark';
                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
                themeToggle.textContent = isDark ? '☀️' : '🌙';
                localStorage.setItem('blog-theme', theme);
            }

            function toggleTheme() {
                const current = document.documentElement.getAttribute('data-theme') || 'light';
                setTheme(current === 'dark' ? 'light' : 'dark');
            }

            // 初始化主题
            setTheme(getPreferredTheme());
            themeToggle.addEventListener('click', toggleTheme);

            // ---------- 路由 ----------
            function getPostIdFromHash() {
                const hash = window.location.hash.slice(1);
                if (hash.startsWith('post/')) {
                    return hash.slice(5);
                }
                return null;
            }

            function setHash(postId) {
                if (postId) {
                    window.location.hash = `post/${postId}`;
                } else {
                    window.location.hash = '';
                }
            }

            // ---------- 渲染：首页 ----------
            function renderHome() {
                pageHome.classList.remove('hidden');
                pagePost.classList.add('hidden');
                backBtn.classList.remove('visible');

                if (posts.length === 0) {
                    postList.innerHTML = `
                        <div class="error-state">
                            <div class="icon">📭</div>
                            <h2>还没有文章</h2>
                            <p>请在 <code>posts/</code> 目录中添加 Markdown 文件，并更新 <code>index.json</code></p>
                        </div>
                    `;
                    return;
                }

                // 按日期降序排列（最新的在前）
                const sorted = [...posts].sort((a, b) => {
                    return new Date(b.date) - new Date(a.date);
                });

                let html = '';
                for (const post of sorted) {
                    const dateStr = formatDate(post.date);
                    const summary = post.summary || '点击阅读全文…';
                    html += `
                        <article class="post-card fade-in" data-id="${post.id}">
                            <div class="meta">
                                <span class="date">📅 ${dateStr}</span>
                                ${post.tag ? `<span class="tag">#${post.tag}</span>` : ''}
                            </div>
                            <h2><a href="#post/${post.id}">${escapeHtml(post.title)}</a></h2>
                            <p class="summary">${escapeHtml(summary)}</p>
                            <span class="read-more">阅读全文</span>
                        </article>
                    `;
                }
                postList.innerHTML = html;

                // 点击卡片跳转
                postList.querySelectorAll('.post-card').forEach(card => {
                    card.addEventListener('click', function(e) {
                        // 如果点击的是内部的 a 标签，不重复触发
                        if (e.target.closest('a')) return;
                        const id = this.dataset.id;
                        if (id) navigateToPost(id);
                    });
                });
            }

            // ---------- 渲染：文章详情 ----------
            async function renderPost(postId) {
                // 查找文章元数据
                const meta = posts.find(p => p.id === postId);
                if (!meta) {
                    postDetail.innerHTML = `
                        <div class="error-state">
                            <div class="icon">🔍</div>
                            <h2>文章未找到</h2>
                            <p>ID: "${escapeHtml(postId)}" 不存在，请检查链接。</p>
                            <p style="margin-top:12px;"><a href="#/" style="text-decoration:underline;">返回首页</a></p>
                        </div>
                    `;
                    pageHome.classList.add('hidden');
                    pagePost.classList.remove('hidden');
                    backBtn.classList.add('visible');
                    return;
                }

                // 显示加载状态
                postDetail.innerHTML = `
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>加载文章内容...</p>
                    </div>
                `;
                pageHome.classList.add('hidden');
                pagePost.classList.remove('hidden');
                backBtn.classList.add('visible');

                try {
                    const mdUrl = `${CONFIG.postsDir}${meta.filename}`;
                    const response = await fetch(mdUrl);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const mdText = await response.text();

                    // 使用 marked 渲染 Markdown
                    const htmlContent = marked.parse(mdText);

                    // 渲染文章
                    const dateStr = formatDate(meta.date);
                    postDetail.innerHTML = `
                        <h1 class="post-title">${escapeHtml(meta.title)}</h1>
                        <div class="post-meta">
                            <span class="date">📅 ${dateStr}</span>
                            ${meta.tag ? `<span>🏷️ ${escapeHtml(meta.tag)}</span>` : ''}
                            <span>📄 ${meta.filename}</span>
                        </div>
                        <div class="post-content fade-in">
                            ${htmlContent}
                        </div>
                    `;

                    // 高亮代码块
                    if (typeof hljs !== 'undefined') {
                        document.querySelectorAll('.post-content pre code').forEach(block => {
                            hljs.highlightElement(block);
                        });
                    }

                    currentPostId = postId;
                    setHash(postId);

                } catch (err) {
                    console.error('加载文章失败:', err);
                    postDetail.innerHTML = `
                        <div class="error-state">
                            <div class="icon">⚠️</div>
                            <h2>加载失败</h2>
                            <p>无法读取文章内容，请检查网络或文件路径。</p>
                            <p style="margin-top:8px;font-size:0.85rem;color:var(--text-muted);">${escapeHtml(err.message)}</p>
                            <p style="margin-top:12px;"><a href="#/" style="text-decoration:underline;">返回首页</a></p>
                        </div>
                    `;
                }
            }

            // ---------- 导航 ----------
            function navigateToPost(postId) {
                if (isLoading) return;
                isLoading = true;
                renderPost(postId).finally(() => {
                    isLoading = false;
                });
            }

            function navigateHome() {
                if (isLoading) return;
                window.location.hash = '';
                pageHome.classList.remove('hidden');
                pagePost.classList.add('hidden');
                backBtn.classList.remove('visible');
                currentPostId = null;
                // 重新渲染首页（保证列表最新）
                renderHome();
            }

            // ---------- 路由处理 ----------
            function handleRoute() {
                const postId = getPostIdFromHash();
                if (postId) {
                    // 如果文章列表还没加载，先加载再跳转
                    if (posts.length === 0) {
                        loadIndex().then(() => {
                            navigateToPost(postId);
                        });
                    } else {
                        navigateToPost(postId);
                    }
                } else {
                    if (posts.length === 0) {
                        loadIndex().then(() => {
                            renderHome();
                        });
                    } else {
                        renderHome();
                    }
                }
            }

            // ---------- 加载文章索引 ----------
            async function loadIndex() {
                try {
                    const response = await fetch(CONFIG.indexUrl);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    if (!Array.isArray(data)) throw new Error('索引格式错误：应为数组');
                    posts = data.filter(item => item.id && item.title && item.filename);
                    return posts;
                } catch (err) {
                    console.error('加载索引失败:', err);
                    posts = [];
                    postList.innerHTML = `
                        <div class="error-state">
                            <div class="icon">📂</div>
                            <h2>加载索引失败</h2>
                            <p>无法读取 <code>index.json</code>，请确保文件存在且格式正确。</p>
                            <p style="margin-top:8px;font-size:0.85rem;color:var(--text-muted);">${escapeHtml(err.message)}</p>
                        </div>
                    `;
                    throw err;
                }
            }

            // ---------- 工具函数 ----------
            function formatDate(dateStr) {
                if (!dateStr) return '未知日期';
                try {
                    const d = new Date(dateStr);
                    if (isNaN(d.getTime())) return dateStr;
                    const y = d.getFullYear();
                    const m = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    return `${y}年${m}月${day}日`;
                } catch {
                    return dateStr;
                }
            }

            function escapeHtml(text) {
                if (!text) return '';
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
            }

            // ---------- 监听路由变化 ----------
            window.addEventListener('hashchange', handleRoute);

            // ---------- 返回按钮 ----------
            backBtn.addEventListener('click', navigateHome);

            // ---------- 初始化 ----------
            async function init() {
                try {
                    await loadIndex();
                    handleRoute();
                } catch (err) {
                    // 错误已在 loadIndex 中处理
                    handleRoute();
                }
            }

            // 如果页面加载时已经有 hash，等 DOM 就绪后处理
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // 暴露给全局，方便调试
            window.__blog = {
                posts,
                navigateToPost,
                navigateHome,
                reload: init,
            };

        })();
    </script>

</body>
</html>
